apiVersion: apps/v1
kind: Deployment
metadata:
  name: globeco-security-service
  namespace: globeco
  labels:
    app: globeco-security-service
spec:
  {{- include "globeco.replicas" . | nindent 2 }}

  # A newly-ready pod must remain ready for 10 seconds before
  # the Deployment considers it available.
  minReadySeconds: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: globeco-security-service
  template:
    metadata:
      labels:
        app: globeco-security-service
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MongoDB at globeco-security-service-mongodb:27017..."
              until nc -z globeco-security-service-mongodb 27017; do
                echo "MongoDB is unavailable - sleeping"
                sleep 2
              done
              echo "MongoDB is up - continuing"
      containers:
        - name: globeco-security-service
          image: kasbench/globeco-security-service:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: "otel-collector-daemonset-collector.monitoring.svc.cluster.local:4317"
            # Inject the node IP from the Downward API
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Point OTEL exporter to the local collector on the same node
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "$(NODE_IP):4317"
            - name: OTEL_SERVICE_NAME
              value: "globeco-security-service"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: ENABLE_METRICS
              value: "true"
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          {{- include "globeco.globecoSecurityServiceResources" . | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8000
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5

{{- if eq .Values.autoscaler "vpa" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: globeco-security-service-pdb
  namespace: globeco

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: globeco-security-service
{{- end }}
